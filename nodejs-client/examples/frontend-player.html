<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海康威视 WebSocket 视频播放器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #00d4ff;
    }
    .config-panel {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1;
      min-width: 300px;
      padding: 12px 16px;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background: #0a0a1a;
      color: #fff;
      font-size: 14px;
    }
    input[type="text"]::placeholder {
      color: #666;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
    }
    .btn-danger {
      background: linear-gradient(135deg, #ff4757, #cc0033);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .video-container {
      background: #0a0a1a;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .placeholder {
      text-align: center;
      color: #666;
    }
    .placeholder-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .stats-panel {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .stat-item {
      background: #0a0a1a;
      padding: 15px;
      border-radius: 8px;
    }
    .stat-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: #00d4ff;
    }
    .log-panel {
      background: #0a0a1a;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
    }
    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid #1a1a2e;
    }
    .log-entry:last-child {
      border-bottom: none;
    }
    .log-time {
      color: #666;
    }
    .log-info {
      color: #00d4ff;
    }
    .log-error {
      color: #ff4757;
    }
    .log-success {
      color: #2ed573;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }
    .status-disconnected {
      background: #333;
      color: #888;
    }
    .status-connecting {
      background: #f39c12;
      color: #fff;
    }
    .status-connected {
      background: #2ed573;
      color: #fff;
    }
    .status-error {
      background: #ff4757;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      海康威视 WebSocket 播放器
      <span id="statusBadge" class="status-badge status-disconnected">未连接</span>
    </h1>

    <div class="config-panel">
      <div class="input-group">
        <input 
          type="text" 
          id="relayUrl" 
          placeholder="转发服务器地址: ws://localhost:8080"
          value="ws://localhost:8080"
        >
        <input 
          type="text" 
          id="cameraUrl" 
          placeholder="海康摄像头 URL: wss://proxy.example.com/proxy/..."
        >
      </div>
      <div class="input-group">
        <button id="btnConnect" class="btn-primary">连接</button>
        <button id="btnDisconnect" class="btn-danger" disabled>断开</button>
      </div>
    </div>

    <div class="video-container">
      <div id="placeholder" class="placeholder">
        <div class="placeholder-icon">📹</div>
        <p>请输入摄像头 URL 并点击连接</p>
      </div>
      <video id="videoPlayer" autoplay playsinline style="display: none;"></video>
    </div>

    <div class="stats-panel">
      <div class="stat-item">
        <div class="stat-label">视频编码</div>
        <div class="stat-value" id="videoCodec">-</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">音频编码</div>
        <div class="stat-value" id="audioCodec">-</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">接收帧数</div>
        <div class="stat-value" id="frameCount">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">数据流量</div>
        <div class="stat-value" id="dataSize">0 KB</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">连接时长</div>
        <div class="stat-value" id="duration">00:00</div>
      </div>
    </div>

    <div class="log-panel" id="logPanel">
      <div class="log-entry">
        <span class="log-time">[系统]</span> 等待连接...
      </div>
    </div>
  </div>

  <script>
    // 海康威视 WebSocket 播放器类
    class HikvisionPlayer {
      constructor() {
        this.ws = null;
        this.mediaSource = null;
        this.sourceBuffer = null;
        this.videoElement = document.getElementById('videoPlayer');
        this.placeholder = document.getElementById('placeholder');
        this.stats = {
          frames: 0,
          bytes: 0,
          startTime: null,
          videoCodec: '-',
          audioCodec: '-'
        };
        this.bufferQueue = [];
        this.isUpdating = false;
      }

      // 连接服务器
      connect(relayUrl, cameraUrl) {
        this.addLog('正在连接转发服务器...', 'info');
        this.updateStatus('connecting', '连接中');

        const wsUrl = `${relayUrl}?url=${encodeURIComponent(cameraUrl)}`;
        this.ws = new WebSocket(wsUrl);
        this.ws.binaryType = 'arraybuffer';

        this.ws.onopen = () => {
          this.addLog('WebSocket 已连接', 'success');
          this.updateStatus('connected', '已连接');
          this.stats.startTime = Date.now();
          this.startDurationTimer();
        };

        this.ws.onmessage = (event) => {
          if (typeof event.data === 'string') {
            this.handleControlMessage(JSON.parse(event.data));
          } else {
            this.handleVideoData(new Uint8Array(event.data));
          }
        };

        this.ws.onerror = (error) => {
          this.addLog('WebSocket 错误: ' + error.message, 'error');
          this.updateStatus('error', '错误');
        };

        this.ws.onclose = () => {
          this.addLog('WebSocket 已断开', 'info');
          this.updateStatus('disconnected', '未连接');
          this.cleanup();
        };
      }

      // 处理控制消息
      handleControlMessage(msg) {
        switch (msg.type) {
          case 'status':
            this.addLog(`状态: ${msg.status}`, 'info');
            break;
          case 'sdp':
            this.addLog('收到 SDP 信息', 'success');
            this.stats.videoCodec = msg.info.videoCodec || '-';
            this.stats.audioCodec = msg.info.audioCodec || '-';
            this.updateStats();
            this.initMediaSource(msg.sdp);
            break;
          case 'error':
            this.addLog('错误: ' + msg.message, 'error');
            this.updateStatus('error', '错误');
            break;
        }
      }

      // 处理视频数据
      handleVideoData(data) {
        this.stats.frames++;
        this.stats.bytes += data.length;
        this.updateStats();

        // 将数据追加到 MediaSource
        if (this.sourceBuffer && !this.sourceBuffer.updating) {
          try {
            this.sourceBuffer.appendBuffer(data);
          } catch (e) {
            // 如果 buffer 满了，移除旧数据
            if (e.name === 'QuotaExceededError') {
              const removeEnd = this.videoElement.currentTime - 10;
              if (removeEnd > 0) {
                this.sourceBuffer.remove(0, removeEnd);
              }
            }
          }
        } else {
          this.bufferQueue.push(data);
        }
      }

      // 初始化 MediaSource
      initMediaSource(sdp) {
        // 注意：浏览器原生不支持直接播放海康的私有流格式
        // 这里使用 MediaSource Extensions (MSE) 尝试播放
        // 实际项目中可能需要使用 ffmpeg.js 或 WebCodecs API 解码

        if (!window.MediaSource) {
          this.addLog('浏览器不支持 MediaSource', 'error');
          return;
        }

        // 检查是否为 H.264 流
        const isH264 = this.stats.videoCodec.toUpperCase().includes('H264');
        const isH265 = this.stats.videoCodec.toUpperCase().includes('H265') || 
                       this.stats.videoCodec.toUpperCase().includes('HEVC');

        if (isH265) {
          this.addLog('H.265 需要特殊解码器，浏览器可能不支持', 'error');
          // H.265 需要转码或使用 WebAssembly 解码器
          this.showVideoPlaceholder('H.265 格式需要转码后才能播放');
          return;
        }

        // 尝试使用 MSE 播放 H.264
        this.setupMSE();
      }

      // 设置 MediaSource
      setupMSE() {
        this.mediaSource = new MediaSource();
        this.videoElement.src = URL.createObjectURL(this.mediaSource);

        this.mediaSource.addEventListener('sourceopen', () => {
          this.addLog('MediaSource 已打开', 'success');
          
          // 尝试添加视频源
          // 注意：实际的海康流可能需要先封装为 fmp4 或 mpegts 格式
          try {
            const mimeType = 'video/mp4; codecs="avc1.42E01E"';
            if (MediaSource.isTypeSupported(mimeType)) {
              this.sourceBuffer = this.mediaSource.addSourceBuffer(mimeType);
              this.sourceBuffer.mode = 'sequence';
              
              this.sourceBuffer.addEventListener('updateend', () => {
                if (this.bufferQueue.length > 0 && !this.sourceBuffer.updating) {
                  const data = this.bufferQueue.shift();
                  this.sourceBuffer.appendBuffer(data);
                }
              });

              this.showVideo();
            } else {
              this.addLog('浏览器不支持 H.264 解码', 'error');
              this.showVideoPlaceholder('浏览器不支持该视频格式');
            }
          } catch (e) {
            this.addLog('MediaSource 错误: ' + e.message, 'error');
          }
        });
      }

      // 显示视频元素
      showVideo() {
        this.placeholder.style.display = 'none';
        this.videoElement.style.display = 'block';
      }

      // 显示占位提示
      showVideoPlaceholder(text) {
        this.placeholder.innerHTML = `
          <div class="placeholder-icon">⚠️</div>
          <p>${text}</p>
        `;
        this.videoElement.style.display = 'none';
        this.placeholder.style.display = 'block';
      }

      // 断开连接
      disconnect() {
        if (this.ws) {
          this.ws.close();
        }
        this.cleanup();
      }

      // 清理资源
      cleanup() {
        if (this.mediaSource) {
          if (this.mediaSource.readyState === 'open') {
            this.mediaSource.endOfStream();
          }
          this.mediaSource = null;
        }
        if (this.videoElement.src) {
          URL.revokeObjectURL(this.videoElement.src);
          this.videoElement.src = '';
        }
        this.sourceBuffer = null;
        this.bufferQueue = [];
        this.stats = {
          frames: 0,
          bytes: 0,
          startTime: null,
          videoCodec: '-',
          audioCodec: '-'
        };
        this.updateStats();
        this.stopDurationTimer();
        
        this.placeholder.style.display = 'block';
        this.videoElement.style.display = 'none';
      }

      // 更新状态显示
      updateStatus(status, text) {
        const badge = document.getElementById('statusBadge');
        badge.className = `status-badge status-${status}`;
        badge.textContent = text;

        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');
        
        if (status === 'connected') {
          btnConnect.disabled = true;
          btnDisconnect.disabled = false;
        } else if (status === 'disconnected' || status === 'error') {
          btnConnect.disabled = false;
          btnDisconnect.disabled = true;
        } else {
          btnConnect.disabled = true;
          btnDisconnect.disabled = false;
        }
      }

      // 更新统计信息
      updateStats() {
        document.getElementById('videoCodec').textContent = this.stats.videoCodec;
        document.getElementById('audioCodec').textContent = this.stats.audioCodec;
        document.getElementById('frameCount').textContent = this.stats.frames.toLocaleString();
        document.getElementById('dataSize').textContent = 
          (this.stats.bytes / 1024).toFixed(1) + ' KB';
      }

      // 启动时长计时器
      startDurationTimer() {
        this.durationTimer = setInterval(() => {
          if (this.stats.startTime) {
            const seconds = Math.floor((Date.now() - this.stats.startTime) / 1000);
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('duration').textContent = `${mins}:${secs}`;
          }
        }, 1000);
      }

      // 停止时长计时器
      stopDurationTimer() {
        if (this.durationTimer) {
          clearInterval(this.durationTimer);
          this.durationTimer = null;
        }
        document.getElementById('duration').textContent = '00:00';
      }

      // 添加日志
      addLog(message, type = 'info') {
        const panel = document.getElementById('logPanel');
        const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `
          <span class="log-time">[${time}]</span>
          <span class="log-${type}">${message}</span>
        `;
        panel.appendChild(entry);
        panel.scrollTop = panel.scrollHeight;
        
        // 限制日志数量
        while (panel.children.length > 100) {
          panel.removeChild(panel.firstChild);
        }
      }
    }

    // 初始化
    const player = new HikvisionPlayer();

    document.getElementById('btnConnect').addEventListener('click', () => {
      const relayUrl = document.getElementById('relayUrl').value.trim();
      const cameraUrl = document.getElementById('cameraUrl').value.trim();
      
      if (!relayUrl || !cameraUrl) {
        alert('请输入转发服务器地址和摄像头 URL');
        return;
      }
      
      player.connect(relayUrl, cameraUrl);
    });

    document.getElementById('btnDisconnect').addEventListener('click', () => {
      player.disconnect();
    });

    // 回车键连接
    document.getElementById('cameraUrl').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('btnConnect').click();
      }
    });
  </script>
</body>
</html>
